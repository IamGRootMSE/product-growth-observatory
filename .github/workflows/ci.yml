name: Validate analysis and site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m observatory.pipeline --fixture
      - run: python scripts/write_summary.py
      - run: git diff --exit-code -- site/data.json
      - run: git diff --exit-code -- README.md docs/decision-memo.md docs/decision-memo.html
      - run: python scripts/build.py
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: outputs/screenshots/
